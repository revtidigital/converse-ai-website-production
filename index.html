    <!-- Non-blocking Analytics & Tracking (Clarity & Meta Pixel) -->
    <script>
      // Microsoft Clarity stub
      window.clarity = window.clarity || function() { (window.clarity.q = window.clarity.q || []).push(arguments); };

      // Meta Pixel stub
      !function(f,b,e,v,n,t,s) {
        if(f.fbq) return;
        n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];
      }(window, document, 'script');
      fbq('init', '1477034076305247');
      fbq('track', 'PageView');

      // Defer external tracking script downloads until browser is idle or after first interaction
      (function() {
        var loaded = false;
        function loadTrackers() {
          if (loaded) return;
          loaded = true;

          // Microsoft Clarity script
          var cScript = document.createElement('script');
          cScript.async = true;
          cScript.src = "https://www.clarity.ms/tag/wenqj2tgtm";
          document.head.appendChild(cScript);

          // Meta Pixel script
          var fbScript = document.createElement('script');
          fbScript.async = true;
          fbScript.src = "https://connect.facebook.net/en_US/fbevents.js";
          document.head.appendChild(fbScript);
        }

        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadTrackers, { timeout: 6000 });
        } else {
          window.addEventListener('load', function() {
            setTimeout(loadTrackers, 4000);
          });
        }
        ['touchstart', 'scroll', 'pointerdown', 'keydown'].forEach(function(evt) {
          window.addEventListener(evt, loadTrackers, { once: true, passive: true });
        });

    </script>

    <!-- UTM Parameter Capture -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        function getParam(name) {
          var urlParams = new URLSearchParams(window.location.search);
          return urlParams.get(name);
        }
        var utmKeys = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','utm_id'];
        utmKeys.forEach(function(key) {
          var val = getParam(key);
          if (val) localStorage.setItem(key, val);
        });
      })();
    </script>
    <!-- End UTM Parameter Capture -->

    <div id="root"></div>

    <!-- On-Demand reCAPTCHA loader (loads only when user interacts with forms/CTAs, saving 700+ KiB on initial load) -->
    <script>
      (function() {
        var loaded = false;
        function loadReCaptcha() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.src = "https://www.google.com/recaptcha/api.js?render=6Ld6E40sAAAAAAayjrv2wh-ZInD0yK12mVNWlmpH";
          s.async = true;
          s.defer = true;
          document.head.appendChild(s);
        }
        // Load on first interaction with a form field or CTA button
        document.addEventListener('focusin', function(e) {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) {
            loadReCaptcha();
          }
        }, { once: true, passive: true });
        document.addEventListener('pointerdown', function(e) {
          var t = e.target && e.target.closest ? e.target.closest('button, a[href*="demo"], a[href*="contact"]') : null;
          if (t) loadReCaptcha();
        }, { once: true, passive: true });
      })();
    </script>
